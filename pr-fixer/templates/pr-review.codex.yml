# Automatic review -> fix -> re-review loop for every pull request, using OpenAI Codex.
# Copy to .github/workflows/pr-review.yml, and copy pr-review-cycle.codex.yml to
# .github/workflows/pr-review-cycle.yml (this file calls it). Needs the secret OPENAI_API_KEY.
# Input names follow openai/codex-action@v1 as documented on 2026-10-14. Re-check them
# and the model ids in references/harness-matrix.md before use.
# Artifacts on the PR follow references/pr-protocol.md (same file in both skills).
#
# THE LOOP RUNS IN ONE WORKFLOW RUN. `review` publishes pass p. When it is BLOCKED, the jobs
# cycle-1 to cycle-11 each call pr-review-cycle.yml once, in order. A stage plans from the markers
# (never from its own index), lets the fixer answer pass c (cycle c), and re-reviews the answer
# (pass c+1). While the re-review is still BLOCKED the next stage runs. The cycle number always
# comes from the `pass=` of the newest trusted marker, so a stage never invents one.
# Why chained stages and not a workflow_dispatch per cycle: a dispatched run is attached to the
# default branch's commit, not to the PR head, so its `review-gate` result would land on the wrong
# commit, and a cycle that only refused findings (no push) and ended PASSED would leave the head's
# required check red. Chained stages keep the whole loop inside this pull_request run, exactly
# where the one-cycle design kept it.
#
# BUDGET. Repository variables, with these defaults:
#   MAX_REVIEW_CYCLES       5    automatic review-fix-review cycles
#   MAX_REVIEW_CYCLES_HARD  10   absolute ceiling, no extension passes it. Clamped to 10: this
#                                file defines 11 stages (10 cycles plus the final halt)
#   EXTENSION_WAIT_SECONDS  300  how long the question waits for an answer
# After cycle 5 ends with a CRITICAL still open, the next stage does not start cycle 6. Its
# `extension-wait` job (no LLM) posts one question with the marker
# `<!-- pr-skill-extension: state=asked ... -->` and polls the PR comments every 15 seconds. A
# comment whose first line is exactly `/pr-skill continue N` or `/pr-skill stop`, written by a
# login whose repository permission is write, maintain or admin, answers it, and the first valid
# answer wins. `continue N` posts the granted marker and the loop runs N more cycles. `stop`, or no
# valid answer in time, posts the halted marker; the PR stays review:blocked and needs a person.
# While an unexpired question is the newest extension marker, no review or fix starts.
#
# PUSH TOKEN. A push made with the default GITHUB_TOKEN does NOT start other workflow runs, so
# required CI never runs on the fixer's commit and that commit never gets a `review-gate` result.
# Either create a GitHub App token or a fine-grained PAT with contents:write on this repository
# and store it as the secret FIXER_PUSH_TOKEN (used only for the fix job's checkout and push), or
# re-trigger CI on the fixer's commit by hand. With FIXER_PUSH_TOKEN each fixer push queues a new
# run of this workflow; the newest queued run starts after this one, finds the re-review marker
# already at its head, reviews nothing, and reports `review-gate` on the final commit.
#
# CONCURRENCY. cancel-in-progress is false on purpose: with FIXER_PUSH_TOKEN the fixer's own push
# would otherwise cancel this run before the closure comment and the re-review. A newer push waits
# for the current run instead of racing it.
#
# REQUIRED CHECK. Mark the `review-gate` job as a required status check in branch protection (or
# a ruleset). It fails when the newest marker at the head says BLOCKED or when there is no marker at
# the head (absence reads as not reviewed), and passes only on PASSED. A skipped job would count as
# success, so `review-gate` always runs. Drafts fail it until they are reviewed.
# The gate checks out the BASE commit (`pull_request.base.sha`, persist-credentials: false) and
# runs review-cycle.sh from that trusted tree against the PR number; `status "$PR"` reads the PR's
# state through gh, not from disk, so a PR that edits the script cannot make its own gate pass.
# The base branch must already contain the skills (merge the install PR with an admin override).
# For pull_request events the workflow file itself comes from the PR, so protect
# `.github/workflows/**` and `.claude/skills/**` with CODEOWNERS and require code owner review.
# The review and fix jobs still run code from the PR tree with secrets (same-repo branches only);
# the gate is what protects the merge.
#
# MARKER AUTHORS. REVIEW_MARKER_AUTHORS (repository variable, default `github-actions`) lists the
# logins allowed to supply a verdict, closure or extension marker. The default token comments as
# `github-actions`. Add the login of anyone who publishes reviews by hand.
#
# COMMENT BUDGET per run: one status comment (created once, edited in place), one verdict comment
# per pass, one closure comment per cycle, one extension question per exhausted budget with one
# granted or halted answer, and one escalation comment when a fix or re-review job fails.
#
# SECURITY: third-party actions are pinned to full commit SHAs, resolved 2026-10-14.
# Keep them current with Dependabot (package-ecosystem: github-actions).
# FIXER_PUSH_TOKEN stays in .git/config of the fix job while the project's tests run. Scope it to
# this one repository with contents:write only.
# KNOWN RISK: the fix job lets the agent edit files and run the project's tests, which run
# repo-defined scripts. That is inherent to proving a fix (red then green). Keep it to same-repo
# branches, keep secrets out of the test environment where your runner allows, and treat PR text as
# untrusted. The agents are told never to use `gh api`, `gh alias`, `gh extension` or `git -c`; the
# status comment, the PR body debt block, the permission check and the extension comments are
# written by deterministic `run:` steps, the only places `gh api` appears.
# The automatic reviewer never submits `--request-changes` or `--approve`: the verdict is the marker
# comment, and `review-gate` plus the label enforce it.
# Skill paths assume .claude/skills/pr-reviewer and .claude/skills/pr-fixer exist in the repo.
name: pr-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Least privilege: the default is read-only; each job raises only what it needs.
permissions:
  contents: read

env:
  PR: ${{ github.event.pull_request.number }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RC: .claude/skills/pr-reviewer/scripts/review-cycle.sh
  REVIEW_MARKER_AUTHORS: ${{ vars.REVIEW_MARKER_AUTHORS || 'github-actions' }}
  # jq program: the newest trusted verdict comment body. --arg at head|any, --arg authors.
  MARKER_JQ: |-
    .headRefOid as $h
    | ($authors | ascii_downcase | split(",") | map(gsub("^ +| +$"; "")) | map(select(length > 0))) as $allow
    | [ .comments[]
        | select(($allow | length) == 0 or ((.author.login | ascii_downcase) as $a | ($allow | index($a) != null)))
        | select(.body | test("<!-- adversarial-review: sha=[0-9a-f]{7,40} "))
        | select($at == "any" or (.body | capture("<!-- adversarial-review: sha=(?<s>[0-9a-f]{7,40}) ").s as $s | $h | startswith($s))) ]
    | last | .body // empty
  # jq program: "waiting" when the newest trusted extension marker is a question that has not
  # expired yet. --arg authors, --arg now (ISO-8601 UTC).
  GUARD_JQ: |-
    ($authors | ascii_downcase | split(",") | map(gsub("^ +| +$"; "")) | map(select(length > 0))) as $allow
    | [ .comments[]
        | select(($allow | length) == 0 or ((.author.login | ascii_downcase) as $a | ($allow | index($a) != null)))
        | select(.body | startswith("<!-- pr-skill-extension: ")) | .body ]
    | (last // "")
    | if startswith("<!-- pr-skill-extension: state=asked ") then ((capture("expires_at=(?<e>[^ >]+)") | .e) // "") else "" end
    | if . != "" and . > $now then "waiting" else "" end

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create the six review labels (idempotent)
        run: .claude/skills/pr-reviewer/scripts/review-cycle.sh ensure-labels

  review:
    needs: labels
    if: github.event.pull_request.draft == false && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
    outputs:
      fresh: ${{ steps.before.outputs.fresh }}
      verdict: ${{ steps.verdict.outputs.verdict }}
      cycle: ${{ steps.verdict.outputs.pass }}
      debt: ${{ steps.verdict.outputs.debt }}
      status_id: ${{ steps.status.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Read the markers (pass number, already reviewed?, extension question open?)
        id: before
        run: |
          json=$(gh pr view "$PR" --json headRefOid,comments)
          at_head=$(printf '%s' "$json" | jq -r --arg authors "$REVIEW_MARKER_AUTHORS" --arg at head "$MARKER_JQ")
          newest=$(printf '%s' "$json" | jq -r --arg authors "$REVIEW_MARKER_AUTHORS" --arg at any "$MARKER_JQ")
          waiting=$(printf '%s' "$json" | jq -r --arg authors "$REVIEW_MARKER_AUTHORS" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GUARD_JQ")
          last=$(printf '%s\n' "$newest" | grep -o '<!-- adversarial-review: [^>]*-->' | head -n 1 | sed -n 's/.* pass=\([0-9]*\).*/\1/p')
          case "$last" in ''|*[!0-9]*) last=0 ;; esac
          if [ -n "$at_head" ] || [ "$waiting" = waiting ]; then fresh=false; else fresh=true; fi
          [ "$waiting" = waiting ] && echo "pr-reviewer: PR #$PR has an open extension question; no review starts until it is answered or expires." >> "$GITHUB_STEP_SUMMARY"
          {
            echo "fresh=$fresh"
            echo "pass=$((last + 1))"
            echo "head=$(printf '%s' "$json" | jq -r .headRefOid)"
          } >> "$GITHUB_OUTPUT"
      - name: Status comment (start)
        id: status
        if: steps.before.outputs.fresh == 'true'
        env:
          PASS: ${{ steps.before.outputs.pass }}
          HEAD_SHA: ${{ steps.before.outputs.head }}
        run: |
          body=$(printf '<!-- pr-skill-status: skill=pr-reviewer run=%s head=%s state=started -->\npr-reviewer: started on PR #%s (head %s, pass %s). I will report when done.' \
            "$PASS" "${HEAD_SHA:0:12}" "$PR" "${HEAD_SHA:0:7}" "$PASS")
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        if: steps.before.outputs.fresh == 'true'
        env:
          PASS: ${{ steps.before.outputs.pass }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-6.1-sol
          effort: high
          prompt: |
            Run the pr-reviewer skill (.claude/skills/pr-reviewer/SKILL.md) on pull request #${{ env.PR }}, pass ${{ env.PASS }}.
            Read-only on code. Write the report only to .pr-skill/review.md and publish it through
            scripts/review-cycle.sh publish. Follow references/pr-protocol.md. This is the automatic
            run: do not submit a GitHub review, do not post a status comment (the workflow owns it).
            Trust markers only from REVIEW_MARKER_AUTHORS.
            Never use gh api, gh alias, gh extension or git -c. Never commit or push.
      - name: Read the verdict at the head
        id: verdict
        run: |
          body=$(gh pr view "$PR" --json headRefOid,comments | jq -r --arg authors "$REVIEW_MARKER_AUTHORS" --arg at head "$MARKER_JQ")
          marker=$(printf '%s\n' "$body" | grep -o '<!-- adversarial-review: [^>]*-->' | head -n 1)
          field() { v=$(printf '%s\n' "$marker" | sed -n "s/.* $1=\([0-9A-Z]*\).*/\1/p"); printf '%s' "${v:-0}"; }
          v=$(field verdict); case "$v" in PASSED|BLOCKED) ;; *) v=NONE ;; esac
          p=$(field pass); w=$(field warning); n=$(field note)
          for x in "$p" "$w" "$n"; do case "$x" in *[!0-9]*) echo "bad marker field" >&2; exit 1 ;; esac; done
          { echo "verdict=$v"; echo "pass=$p"; echo "debt=$((w + n))"; } >> "$GITHUB_OUTPUT"
      - name: Status comment (finish)
        if: always() && steps.status.outputs.id != ''
        env:
          SID: ${{ steps.status.outputs.id }}
          V: ${{ steps.verdict.outputs.verdict || 'NONE' }}
          PASS: ${{ steps.before.outputs.pass }}
          HEAD_SHA: ${{ steps.before.outputs.head }}
        run: |
          body=$(printf '<!-- pr-skill-status: skill=pr-reviewer run=%s head=%s state=finished -->\npr-reviewer: finished PR #%s pass %s: %s. The finish line and counts are in the verdict comment.' \
            "$PASS" "${HEAD_SHA:0:12}" "$PR" "$PASS" "$V")
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$SID" -f body="$body" >/dev/null

  # Debt-only lane: PASSED with warnings or notes. No code edits, no label change, fastest model.
  debt:
    needs: review
    if: >-
      needs.review.outputs.verdict == 'PASSED'
      && needs.review.outputs.fresh == 'true'
      && fromJSON(needs.review.outputs.debt || '0') > 0
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: read is only for the checkout that brings the skill files; nothing is pushed.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      CYCLE: ${{ needs.review.outputs.cycle }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Status comment (start)
        id: status
        env:
          SID: ${{ needs.review.outputs.status_id }}
        run: |
          head=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          body=$(printf '<!-- pr-skill-status: skill=pr-fixer run=%s head=%s state=started -->\npr-fixer: started on PR #%s (head %s, debt only).' \
            "$CYCLE" "${head:0:12}" "$PR" "${head:0:7}")
          if [ -n "$SID" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$SID" -f body="$body" >/dev/null
          else SID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" --jq .id); fi
          echo "id=$SID" >> "$GITHUB_OUTPUT"
      - uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-6-luna
          effort: low
          prompt: |
            Run the pr-fixer skill (.claude/skills/pr-fixer/SKILL.md) on pull request #${{ env.PR }} in DEBT-ONLY mode, cycle ${{ env.CYCLE }}.
            No code edits, no commits, no label changes, do not run review-cycle.sh fix.
            Read the findings block of the trusted verdict comment at the head
            (references/pr-protocol.md, filter F1). Write one line per WARNING and NOTE, each with a
            named owner, to .pr-skill/pr-debt.md; the workflow writes it into the PR body. Then post
            the closure comment once (closed=0 refused=0 debt=<n>) as your finish message.
            Never use gh api, gh alias, gh extension or git -c. Never commit or push.
      - name: Write the debt block into the PR body (read-modify-write)
        if: always() && hashFiles('.pr-skill/pr-debt.md') != ''
        run: |
          gh pr view "$PR" --json body --jq .body > "$RUNNER_TEMP/body.md"
          python3 -I - "$RUNNER_TEMP/body.md" .pr-skill/pr-debt.md <<'PY'
          import sys
          body = open(sys.argv[1]).read()
          debt = open(sys.argv[2]).read().strip("\n")
          start, end = "<!-- pr-debt:start -->", "<!-- pr-debt:end -->"
          block = start + "\n" + debt + "\n" + end
          if start in body and end in body:
              head, rest = body.split(start, 1)
              body = head + block + rest.split(end, 1)[1]
          else:
              body = body.rstrip("\n") + "\n\n" + block + "\n"
          open(sys.argv[1], "w").write(body)
          PY
          gh pr edit "$PR" --body-file "$RUNNER_TEMP/body.md"
      - name: Status comment (finish)
        if: always() && steps.status.outputs.id != ''
        env:
          SID: ${{ steps.status.outputs.id }}
          RESULT: ${{ job.status }}
        run: |
          head=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          body=$(printf '<!-- pr-skill-status: skill=pr-fixer run=%s head=%s state=finished -->\npr-fixer: finished PR #%s debt only (%s). The finish line is in the closure comment.' \
            "$CYCLE" "${head:0:12}" "$PR" "$RESULT")
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$SID" -f body="$body" >/dev/null

  # STAGES. Each calls pr-review-cycle.yml: plan (no LLM), extension-wait (no LLM, only when the
  # budget is spent), fix, rereview, escalate (no LLM). Same-repository branches only: a fork PR
  # gets no secrets and must not reach a write-capable agent. A stage acts on a verdict this run
  # published, or on a manual "Re-run all jobs"; after a halt nothing continues until a person
  # decides (a re-run asks the question again, a push starts a new review).
  cycle-1:
    needs: review
    if: >-
      needs.review.outputs.verdict == 'BLOCKED'
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/pr-review-cycle.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    with:
      stage: 1
      acting: ${{ needs.review.outputs.fresh == 'true' || fromJSON(github.run_attempt) > 1 }}
      status_id: ${{ needs.review.outputs.status_id }}

  cycle-2:
    needs: cycle-1
    if: needs.cycle-1.outputs.more == 'true'
    uses: ./.github/workflows/pr-review-cycle.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    with:
      stage: 2
      acting: true
      status_id: ${{ needs.cycle-1.outputs.status_id }}

  cycle-3:
    needs: cycle-2
    if: needs.cycle-2.outputs.more == 'true'
    uses: ./.github/workflows/pr-review-cycle.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    with:
      stage: 3
      acting: true
      status_id: ${{ needs.cycle-2.outputs.status_id }}

  cycle-4:
    needs: cycle-3
    if: needs.cycle-3.outputs.more == 'true'
    uses: ./.github/workflows/pr-review-cycle.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    with:
      stage: 4
      acting: true
      status_id: ${{ needs.cycle-3.outputs.status_id }}

  cycle-5:
    needs: cycle-4
    if: needs.cycle-4.outputs.more == 'true'
    uses: ./.github/workflows/pr-review-cycle.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    with:
      stage: 5
      acting: true
      status_id: ${{ needs.cycle-4.outputs.status_id }}

  # With the default budget, this is the stage that runs after the re-review of cycle 5: its plan
  # answers `ask`, and its extension-wait job asks, waits, and either grants cycle 6 or halts.
  cycle-6:
    needs: cycle-5
    if: needs.cycle-5.outputs.more == 'true'
    uses: ./.github/workflows/pr-review-cycle.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    with:
      stage: 6
      acting: true
      status_id: ${{ needs.cycle-5.outputs.status_id }}

  cycle-7:
    needs: cycle-6
    if: needs.cycle-6.outputs.more == 'true'
    uses: ./.github/workflows/pr-review-cycle.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    with:
      stage: 7
      acting: true
      status_id: ${{ needs.cycle-6.outputs.status_id }}

  cycle-8:
    needs: cycle-7
    if: needs.cycle-7.outputs.more == 'true'
    uses: ./.github/workflows/pr-review-cycle.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    with:
      stage: 8
      acting: true
      status_id: ${{ needs.cycle-7.outputs.status_id }}

  cycle-9:
    needs: cycle-8
    if: needs.cycle-8.outputs.more == 'true'
    uses: ./.github/workflows/pr-review-cycle.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    with:
      stage: 9
      acting: true
      status_id: ${{ needs.cycle-8.outputs.status_id }}

  cycle-10:
    needs: cycle-9
    if: needs.cycle-9.outputs.more == 'true'
    uses: ./.github/workflows/pr-review-cycle.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    with:
      stage: 10
      acting: true
      status_id: ${{ needs.cycle-9.outputs.status_id }}

  # Last stage: after cycle 10 its plan can only answer ceiling (halted) or ask (when the hard
  # ceiling is set lower and the run started with cycles already done).
  cycle-11:
    needs: cycle-10
    if: needs.cycle-10.outputs.more == 'true'
    uses: ./.github/workflows/pr-review-cycle.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    with:
      stage: 11
      acting: true
      status_id: ${{ needs.cycle-10.outputs.status_id }}

  # REQUIRED STATUS CHECK. Mark this job required in branch protection. It always runs, so it is
  # never "skipped" (which GitHub would count as success). `status` exits 0 only when the newest
  # trusted marker at the head says PASSED; BLOCKED, no marker, or anything unclear fails.
  # It runs review-cycle.sh from the BASE commit, never from the PR tree (see the header).
  review-gate:
    needs: [labels, review, debt, cycle-1, cycle-2, cycle-3, cycle-4, cycle-5, cycle-6, cycle-7, cycle-8, cycle-9, cycle-10, cycle-11]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Marker at the head must say PASSED (script from the base commit)
        run: .claude/skills/pr-reviewer/scripts/review-cycle.sh status "$PR"
