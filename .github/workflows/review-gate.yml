# Required status check for the review loop. Copy to .github/workflows/review-gate.yml.
#
# This workflow runs no model, holds no provider key and writes nothing. It asks one question of
# the pull request: does the newest trusted verdict marker at the head say PASSED? Reviews and
# corrections are done by agents in a person's own harness session, which publish their marker
# comments with `gh`. See references/harness-loop.md.
#
# Mark the `review-gate` job as a required check in branch protection or a ruleset.
#
# It runs review-cycle.sh from the BASE commit, never from the pull request tree, so a pull request
# cannot edit its own gate. The base branch must already contain the skills before the gate can
# pass, so merge the install pull request with an admin override. For pull_request events the
# workflow file itself comes from the pull request: protect `.github/workflows/**` and
# `.agents/skills/**` with CODEOWNERS and require code owner review.
#
# TIMING. The job runs when the pull request is opened or pushed to, before the harness has
# published a verdict, so it fails then (absence reads as not reviewed). A comment does not start a
# pull_request workflow, so after `review-cycle.sh publish` the agent re-runs every failed,
# cancelled or timed-out run of this check for the head SHA. The newest run alone is not enough: on
# PASSED, `publish` marks the draft ready, which starts a `ready_for_review` run that is already
# green while the `opened` or `synchronize` run stays red. `cancel-in-progress` below cancels a run
# when another starts for the same pull request, so re-run one at a time. A push of a new head
# cancels a run or re-run for the old head too; that is intended, since the old head's answer no
# longer counts, and the loop starts again for the new head. After a BLOCKED verdict, skip all of
# this: the check fails on purpose. Otherwise first wait, at most 10 minutes, until this list is
# empty (no run for the head queued or in progress); if a run is still queued or in progress after
# that, stop and tell the person:
#   gh run list --workflow review-gate.yml --commit <head sha> --limit 100 --json databaseId,status \
#     --jq '.[] | select(.status != "completed") | .databaseId'
# Then list the failed ids once and re-run every one of them, waiting for each:
#   gh run list --workflow review-gate.yml --commit <head sha> --limit 100 --json databaseId,conclusion \
#     --jq '.[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | .databaseId'
#   gh run rerun <id> && gh run watch <id> --exit-status
# The job's `timeout-minutes` bounds a run once it starts; `gh run watch` also waits while the
# re-run is queued, so stop a watch that has not finished after 10 minutes and tell the person.
# Do not list again afterwards. The check also fails on purpose with REVIEW_MARKER_AUTHORS unset,
# and fails as inconclusive when REVIEW_BLOCK_AT is neither `critical` nor `warning` or differs
# from the `block_at` of the marker at the head; that failure is its answer.
#
# MARKER AUTHORS. The repository variable REVIEW_MARKER_AUTHORS must list the GitHub login or logins
# the harness publishes as (the account `gh` is authenticated as, for example `jonyfs`). With it
# unset, or naming no login (an entry counts only as ASCII letters, digits, hyphens and underscores, starting with a letter or digit, so a value
# holding only a BOM or a no-break space names nobody), anyone who can comment could forge a PASSED
# marker, so the job refuses to run.
name: review-gate

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Marker at the head must say PASSED (script from the base commit)
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVIEW_MARKER_AUTHORS: ${{ vars.REVIEW_MARKER_AUTHORS }}
          REVIEW_BLOCK_AT: ${{ vars.REVIEW_BLOCK_AT }}
        run: |
          # One entry per line; kept only if it is ASCII letters, digits, hyphens and underscores, starting with a letter or digit once spaces and
          # tabs are trimmed, the rule review-cycle.sh applies. A BOM or no-break space is not a login.
          if ! printf '%s\n' "$REVIEW_MARKER_AUTHORS" | tr -d '\r' | tr ',' '\n' | LC_ALL=C grep -Eq '^[[:blank:]]*[A-Za-z0-9][A-Za-z0-9_-]*[[:blank:]]*$'; then
            echo "::error::Set the repository variable REVIEW_MARKER_AUTHORS to the login the harness publishes verdicts as (ASCII letters, digits, hyphens and underscores, starting with a letter or digit). Without one any commenter could forge a PASSED marker."
            exit 1
          fi
          .agents/skills/pr-reviewer/scripts/review-cycle.sh status "$PR"
