# Tags and publishes the version in VERSION when it lands on main. Runs only when VERSION changed.
# The logic is in .github/scripts/release.sh (tested by tests/release/run.sh against a fake gh); its
# header lists the four states a release can be in and what each run does.
name: release

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

# The lookups and the writes in release.sh are not atomic, so two runs never overlap. A queued run
# waits instead of cancelling the one in progress, which may be half way through a release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create, complete or publish the release for VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh
